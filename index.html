<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">

    <title>ဝတ်ႉမႁုႇဝိႁႃႇရ တႃႈၵုင်ႈ</title>

    <style>

            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #218838;
        }

        footer {
            margin-top: 50px;
            padding: 10px;
            background-color: #ddd;

        }
